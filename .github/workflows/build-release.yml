name: Build and release

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  package:
    name: Package (npm tarball)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # ---------------------------------------------------------------------
      # The browser is puppeteer-core + a system Chromium, not a bundled one:
      # Stage 8 (--execute) only needs to open a page and watch for alert(), and
      # puppeteer-core never downloads its own ~400MB browser. Install one
      # Chromium here so the launch gate below has something to drive.
      # ---------------------------------------------------------------------
      - name: Gate — browser launches and fires a dialog
        run: |
          set -e
          sudo apt-get update && sudo apt-get install -y chromium
          export CHROME_PATH="$(command -v chromium || command -v chromium-browser)"
          node -e '
            (async () => {
              const puppeteer = require("puppeteer-core");
              const browser = await puppeteer.launch({
                executablePath: process.env.CHROME_PATH,
                headless: true,
                args: ["--no-sandbox", "--disable-setuid-sandbox", "--disable-dev-shm-usage"],
              }).catch((e) => { console.error("launch failed:", e.message); return null; });
              if (!browser) process.exit(1);
              const page = await browser.newPage();
              let fired = false;
              page.on("dialog", async (d) => { fired = true; await d.dismiss(); });
              await page.goto("data:text/html,<script>alert(1)</script>").catch(() => {});
              await new Promise((r) => setTimeout(r, 500));
              await browser.close();
              if (!fired) { console.error("alert dialog never fired"); process.exit(1); }
              console.log("alert confirmation ok");
            })().catch((e) => { console.error(e); process.exit(1); });
          '

      - name: Gate — compiled CLI runs with its runtime assets
        run: |
          node dist/cli.js --help >/dev/null
          node dist/cli.js dashboard --port 0 & PID=$!
          sleep 2
          kill "$PID" 2>/dev/null || true

      - name: Pack
        # npm names the file after the package (scope stripped):
        # @mastermind/parallax -> mastermind-parallax-<ver>.tgz. The release asset is
        # named parallax-<ver>.tgz instead; `npm install -g <url>` reads the package
        # name from inside the tarball, so the filename is free to be the tool name.
        run: |
          mkdir -p release
          npm pack --pack-destination release
          mv release/*.tgz "release/parallax-${GITHUB_REF_NAME#v}.tgz"

      # Parity with the only real consumer (Artex): install the packed tarball
      # globally, then launch a browser from THAT installed tree. This is what
      # catches a bad `files` allowlist or a dependency missing from
      # `dependencies` — both used to ship silently.
      - name: Gate — global install of the tarball runs and drives a browser
        run: |
          set -e
          PREFIX="$(mktemp -d)"
          npm install -g --prefix "$PREFIX" ./release/*.tgz
          "$PREFIX/bin/parallax" --help >/dev/null
          ROOT="$PREFIX/lib/node_modules/@mastermind/parallax"
          node -e "
            const path = require('path'), fs = require('fs');
            const root = '$ROOT';
            for (const f of ['dist/cli.js','wordlists/parameters.txt','wordlists/headers.txt','src/vendor/htmx.min.js']) {
              fs.accessSync(path.join(root, f));
              console.log('present:', f);
            }
            (async () => {
              const puppeteer = require(path.join(root, 'node_modules/puppeteer-core'));
              const browser = await puppeteer.launch({
                executablePath: process.env.CHROME_PATH,
                headless: true,
                args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-dev-shm-usage'],
              }).catch(() => null);
              if (!browser) { console.error('installed copy cannot launch a browser'); process.exit(1); }
              await browser.close();
              console.log('installed copy launches a browser');
            })().catch((e) => { console.error(e); process.exit(1); });
          "

      - uses: actions/upload-artifact@v4
        with:
          name: parallax-tarball
          path: release/*.tgz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
